name: Windows print agent
on:
  push:
    paths:
      - 'windows-print-agent/**'
      - '.github/workflows/windows-print-agent.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and compile .NET Framework service
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem windows-print-agent/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw ($errors | Out-String)}
          }
          $compiler="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $source=(Resolve-Path 'windows-print-agent\GesTisserPrintAgent.cs').Path
          $output=Join-Path $PWD.Path 'windows-print-agent\GesTisserPrintAgent.exe'
          & $compiler /nologo /target:exe "/out:$output" /reference:System.ServiceProcess.dll /reference:System.Web.Extensions.dll /reference:System.Drawing.dll /reference:System.Security.dll $source
          if($LASTEXITCODE -ne 0){throw 'Compilation failed'}
          & $output --self-test
          if($LASTEXITCODE -ne 0){throw 'Agent self-test failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: GesTisserPrintAgent-Windows10
          path: windows-print-agent/
          retention-days: 14
